[project]
name = "roadmapprojectdjango"
version = "0.1.0"
description = ""
authors = [
    {name = "Timur Grebennikov", email = "grebennikovtimur@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "radon (>=6.0.1,<7.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.1.0,<3.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "api", "config"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "apps.payment.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "apps.payment.tests"
ignore_errors = true

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
loguru = { version = "^0.7.3", markers = "python_version >= '3.12' and python_version < '4.0'" }